server {
    listen 80;
    listen [::]:80;
    server_name api-nosub.43-130-246-125.sslip.io;

    client_max_body_size 256k;
    # Do not retain raw visitor IP addresses in access logs. Country is resolved
    # in memory by the API and only the resulting two-letter code is stored.
    access_log off;

    # Keep the Python dictionary service on loopback. The extension reaches it
    # through this HTTPS path so lookups do not depend on broad browser host
    # permissions or expose port 8899 publicly.
    location /dictionary/ {
        proxy_pass http://127.0.0.1:8899/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
