name: Deploy billing site

on:
  push:
    branches: [master]
    paths:
      - billing-site/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-billing-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm billing:build
        env:
          VITE_PADDLE_ENVIRONMENT: ${{ vars.VITE_PADDLE_ENVIRONMENT }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_MONTHLY_PRICE_ID: ${{ vars.VITE_PADDLE_MONTHLY_PRICE_ID }}
          VITE_PADDLE_QUARTERLY_PRICE_ID: ${{ vars.VITE_PADDLE_QUARTERLY_PRICE_ID }}
          VITE_PADDLE_ANNUAL_PRICE_ID: ${{ vars.VITE_PADDLE_ANNUAL_PRICE_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: billing-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
